<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Folgefonna Weather Station</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background: #e8f4e0; color: #1d401d; padding: 24px; }
        h1 { font-size: 1.5em; margin-bottom: 4px; color: #1d401d; }
        .subtitle { color: #415240; font-size: 0.9em; margin-bottom: 16px; }
        .info-row { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
        .info-card { background: #c7e0b6; border-radius: 8px; padding: 12px 16px; font-size: 0.9em; }
        .info-card strong { display: block; color: #415240; font-size: 0.8em; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
        .info-card span { font-size: 1.1em; color: #1d401d; }
        .header { display: flex; gap: 20px; align-items: flex-start; margin-bottom: 20px; }
        .left-col  { display: flex; flex-direction: column; gap: 12px; flex-shrink: 0; width: 280px; }
        .right-col { display: flex; flex-direction: column; gap: 12px; flex-shrink: 0; width: 280px; }
        .header-content { flex: 1; min-width: 0; }
        .mini-row { display: flex; gap: 12px; align-items: flex-start; }
        .photo-card { background: #e8f4e0; border-radius: 8px; overflow: hidden; }
        .photo-card img { display: block; width: 100%; height: auto; }
        .current-conditions { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
        .stat-card { background: #e8f4e0; border-radius: 8px; padding: 16px 20px; text-align: center; flex: 1; min-width: 100px; }
        .stat-label { color: #415240; font-size: 0.75em; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; }
        .stat-value { font-size: 2em; font-weight: 600; color: #1d401d; line-height: 1; }
        .stat-unit  { color: #78a057; font-size: 0.85em; margin-top: 4px; }
        .mini-charts { display: flex; gap: 12px; }
        .mini-card { background: #e8f4e0; border-radius: 8px; padding: 8px; flex: 1; min-width: 0; }
        @media (max-width: 900px) { .header { flex-wrap: wrap; } .left-col, .right-col { width: 100%; flex-direction: row; } }
        @media (max-width: 700px) { .mini-charts { flex-direction: column; } }
    </style>
</head>
<body>
    <div class="header">
        <div class="left-col">
            <div class="photo-card"><img src="logo.png" alt="Logo"></div>
            <div class="photo-card"><img src="map.png" alt="Station location map"></div>
            <div class="photo-card"><img src="station.jpg" alt="Weather station photo"></div>
        </div>

        <div class="header-content">
            <h1>Folgefonna Summit Weather Station</h1>
            <p class="subtitle" id="updated">Loading...</p>

            <div class="current-conditions">
                <div class="stat-card">
                    <div class="stat-label">Temperature</div>
                    <div class="stat-value" id="cur-temp">—</div>
                    <div class="stat-unit">°C</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Humidity</div>
                    <div class="stat-value" id="cur-hum">—</div>
                    <div class="stat-unit">%</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Cloudiness</div>
                    <div class="stat-value" id="cur-cloud">—</div>
                    <div class="stat-unit">%</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Wind Speed</div>
                    <div class="stat-value" id="cur-wind">—</div>
                    <div class="stat-unit">m/s</div>
                </div>
            </div>

            <div class="info-row">
                <div class="info-card"><strong>Last Measurement</strong><span id="last-measurement">—</span></div>
                <div class="info-card"><strong>Surface Condition</strong><span id="surface-condition">—</span></div>
                <div class="info-card"><strong>Time Since Last Rain</strong><span id="time-rain">—</span></div>
                <div class="info-card"><strong>Altitude Melt Trend</strong><span id="altitude-trend">—</span></div>
                <div class="info-card"><strong>Altitude Total Drop</strong><span id="altitude-total-drop">—</span></div>
            </div>

            <div class="mini-row">
                <div class="mini-charts">
                    <div class="mini-card"><img src="windrose.png" alt="Wind rose" style="width:100%;height:auto;display:block;border-radius:4px;"></div>
                    <div class="mini-card"><img src="temp_pressure_plot.png" alt="Temperature and pressure" style="width:100%;height:auto;display:block;border-radius:4px;"></div>
                </div>
                <div class="right-col">
                    <div class="photo-card"><img src="setup1.jpg" alt="Setup 1"></div>
                    <div class="photo-card"><img src="setup2.jpg" alt="Setup 2"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
    function lastValid(arr) {
        if (!arr) return null;
        for (let i = arr.length - 1; i >= 0; i--) {
            if (arr[i] !== null && arr[i] !== undefined) return arr[i];
        }
        return null;
    }

    fetch('data.json')
        .then(r => r.json())
        .then(d => {
            const t = d.t;
            const tStart = t[0], tEnd = t[t.length - 1];
            const startLabel = new Date(tStart).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
            const endLabel   = new Date(tEnd).toLocaleDateString('en-GB',   { day: 'numeric', month: 'short', year: 'numeric' });
            document.getElementById('updated').textContent =
                startLabel + ' – ' + endLabel + ' · Last updated: ' + new Date(d.updated).toLocaleTimeString('en-GB');

            const curTemp      = lastValid(d.Temp1);
            const curHum       = lastValid(d.Hum1);
            const curClearness = lastValid(d.ClearnessIndex);
            const curWind      = lastValid(d.WindSpeed);
            document.getElementById('cur-temp').textContent  = curTemp      !== null ? curTemp.toFixed(1)                   : '—';
            document.getElementById('cur-hum').textContent   = curHum       !== null ? Math.round(curHum)                   : '—';
            document.getElementById('cur-cloud').textContent = curClearness !== null ? Math.round((1 - curClearness) * 100) : '—';
            document.getElementById('cur-wind').textContent  = curWind      !== null ? curWind.toFixed(1)                   : '—';

            document.getElementById('last-measurement').textContent =
                new Date(tEnd).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });

            const lastSurface = d.SurfaceCondition ? d.SurfaceCondition.filter(s => s && s !== 'nan').pop() || '—' : '—';
            document.getElementById('surface-condition').textContent = lastSurface;
            document.getElementById('time-rain').textContent         = d.TimeSinceLastRain || '—';
            document.getElementById('altitude-trend').textContent    = d.Altitude_melt_trend || '—';
            document.getElementById('altitude-total-drop').textContent = d.Altitude_total_drop || '—';
        })
        .catch(err => {
            document.getElementById('updated').textContent = 'Error loading data: ' + err.message;
        });
    </script>
</body>
</html>
