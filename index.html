<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Folgefonna Weather Station</title>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background: #f4f4f4; color: #333; padding: 24px; }
        h1 { font-size: 1.5em; margin-bottom: 4px; }
        .subtitle { color: #888; font-size: 0.9em; margin-bottom: 16px; }
        .info-row { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
        .info-card { background: white; border-radius: 8px; padding: 12px 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); font-size: 0.9em; }
        .info-card strong { display: block; color: #555; font-size: 0.8em; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
        .info-card span { font-size: 1.1em; color: #222; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .card { background: white; border-radius: 8px; padding: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
        .card.full { grid-column: 1 / -1; }
        .header { display: flex; gap: 20px; align-items: flex-start; margin-bottom: 20px; }
        .left-col  { display: flex; flex-direction: column; gap: 12px; flex-shrink: 0; width: 280px; }
        .right-col { display: flex; flex-direction: column; gap: 12px; flex-shrink: 0; width: 280px; }
        .header-content { flex: 1; min-width: 0; }
        .mini-row { display: flex; gap: 12px; align-items: flex-start; }
        .photo-card { background: white; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); overflow: hidden; }
        .photo-card img { display: block; width: 100%; height: auto; }
        /* Current conditions */
        .current-conditions { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
        .stat-card { background: white; border-radius: 8px; padding: 16px 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); text-align: center; flex: 1; min-width: 100px; }
        .stat-label { color: #888; font-size: 0.75em; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; }
        .stat-value { font-size: 2em; font-weight: 600; color: #222; line-height: 1; }
        .stat-unit  { color: #aaa; font-size: 0.85em; margin-top: 4px; }
        /* Mini charts row */
        .mini-charts { display: flex; gap: 12px; }
        .mini-card { background: white; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); padding: 8px; flex: 1; min-width: 0; }
        @media (max-width: 900px) { .header { flex-wrap: wrap; } .left-col, .right-col { width: 100%; flex-direction: row; } }
        @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } .card.full { grid-column: 1; } .mini-charts { flex-direction: column; } }
    </style>
</head>
<body>
    <div class="header">
        <!-- Left column: map + station photo -->
        <div class="left-col">
            <div class="photo-card"><img src="map.png" alt="Station location map"></div>
            <div class="photo-card"><img src="station.jpg" alt="Weather station photo"></div>
        </div>

        <!-- Title + everything to the right of the left col -->
        <div class="header-content">
            <h1>Folgefonna Weather Station</h1>
            <p class="subtitle" id="updated">Loading...</p>

            <div class="current-conditions">
                <div class="stat-card">
                    <div class="stat-label">Temperature</div>
                    <div class="stat-value" id="cur-temp">—</div>
                    <div class="stat-unit">°C</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Humidity</div>
                    <div class="stat-value" id="cur-hum">—</div>
                    <div class="stat-unit">%</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Cloudiness</div>
                    <div class="stat-value" id="cur-cloud">—</div>
                    <div class="stat-unit">%</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Wind Speed</div>
                    <div class="stat-value" id="cur-wind">—</div>
                    <div class="stat-unit">m/s</div>
                </div>
            </div>

            <div class="info-row">
                <div class="info-card"><strong>Last Measurement</strong><span id="last-measurement">—</span></div>
                <div class="info-card"><strong>Surface Condition</strong><span id="surface-condition">—</span></div>
                <div class="info-card"><strong>Time Since Last Rain</strong><span id="time-rain">—</span></div>
                <div class="info-card"><strong>Altitude Melt Trend</strong><span id="altitude-trend">—</span></div>
                <div class="info-card"><strong>Altitude Total Drop</strong><span id="altitude-total-drop">—</span></div>
            </div>

            <div class="mini-row">
                <div class="mini-charts">
                    <div class="mini-card"><img src="windrose.png" alt="Wind rose" style="width:100%;height:auto;display:block;border-radius:4px;"></div>
                    <div class="mini-card"><div id="chart-temp-mini"></div></div>
                </div>
                <div class="right-col">
                    <div class="photo-card"><img src="setup1.jpg" alt="Setup 1"></div>
                    <div class="photo-card"><img src="setup2.jpg" alt="Setup 2"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="grid">
        <div class="card"><div id="chart-temp"></div></div>
        <div class="card"><div id="chart-humidity"></div></div>
        <div class="card full"><div id="chart-radiation"></div></div>
        <div class="card"><div id="chart-wind-speed"></div></div>
        <div class="card"><div id="chart-wind-dir"></div></div>
        <div class="card"><div id="chart-pressure"></div></div>
        <div class="card"><div id="chart-altitude"></div></div>
        <div class="card"><div id="chart-albedo"></div></div>
        <div class="card"><div id="chart-clearness"></div></div>
    </div>

    <script>
    const COLORS = {
        Temp1: '#C0392B',
        Hum1: '#2980B9',
        WindSpeed: '#27AE60', WindMax: '#82E0AA',
        SWin: '#E8A838', SWout: '#FFDA48', LWin: '#7B2D8B', LWout: '#BFA8D3',
        Pressure: '#16A085',
        Altitude: '#2C3E50', AltitudeTrend: '#7F8C8D',
        Albedo: '#E67E22',
        ClearnessIndex: '#3498DB'
    };

    function layout(ytitle) {
        return {
            margin: { t: 10, b: 40, l: 55, r: 10 },
            xaxis: {
                type: 'date',
                tickformat: '%d %b %H:%M',
                dtick: 12 * 3600000,
                showgrid: true, gridcolor: '#eee'
            },
            yaxis: { title: ytitle, showgrid: true, gridcolor: '#eee' },
            legend: { orientation: 'h', y: -0.3 },
            plot_bgcolor: 'white', paper_bgcolor: 'white',
            font: { family: 'sans-serif', size: 12 },
        };
    }

    function line(t, y, name, dash) {
        return { x: t, y, name, type: 'scatter', mode: 'lines',
                 line: { color: COLORS[name], width: 1.5, dash: dash || 'solid' } };
    }

    function lastValid(arr) {
        if (!arr) return null;
        for (let i = arr.length - 1; i >= 0; i--) {
            if (arr[i] !== null && arr[i] !== undefined) return arr[i];
        }
        return null;
    }

    const cfg = { responsive: true, displayModeBar: false };

    fetch('data.json')
        .then(r => r.json())
        .then(d => {
            const t = d.t;
            const tStart = t[0], tEnd = t[t.length - 1];
            const startLabel = new Date(tStart).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
            const endLabel   = new Date(tEnd).toLocaleDateString('en-GB',   { day: 'numeric', month: 'short', year: 'numeric' });
            document.getElementById('updated').textContent =
                startLabel + ' – ' + endLabel + ' · Last updated: ' + new Date(d.updated).toLocaleTimeString('en-GB');

            // Current conditions
            const curTemp      = lastValid(d.Temp1);
            const curHum       = lastValid(d.Hum1);
            const curClearness = lastValid(d.ClearnessIndex);
            const curWind      = lastValid(d.WindSpeed);
            document.getElementById('cur-temp').textContent  = curTemp      !== null ? curTemp.toFixed(1)                   : '—';
            document.getElementById('cur-hum').textContent   = curHum       !== null ? Math.round(curHum)                   : '—';
            document.getElementById('cur-cloud').textContent = curClearness !== null ? Math.round((1 - curClearness) * 100) : '—';
            document.getElementById('cur-wind').textContent  = curWind      !== null ? curWind.toFixed(1)                   : '—';

            document.getElementById('last-measurement').textContent =
                new Date(tEnd).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });

            const lastSurface = d.SurfaceCondition ? d.SurfaceCondition.filter(s => s && s !== 'nan').pop() || '—' : '—';
            document.getElementById('surface-condition').textContent = lastSurface;
            document.getElementById('time-rain').textContent        = d.TimeSinceLastRain || '—';
            document.getElementById('altitude-trend').textContent   = d.Altitude_melt_trend || '—';
            document.getElementById('altitude-total-drop').textContent = d.Altitude_total_drop || '—';

            // ── Temperature — last 48 h ───────────────────────────────────────
            const cutoff48h = new Date(new Date(tEnd) - 48 * 3600 * 1000).toISOString();
            const tMini    = t.filter(ts => ts >= cutoff48h);
            const tempMini = d.Temp1.filter((_, i) => t[i] >= cutoff48h);
            Plotly.newPlot('chart-temp-mini', [{
                x: tMini, y: tempMini, type: 'scatter', mode: 'lines',
                line: { color: COLORS.Temp1, width: 1.5 }, showlegend: false
            }], {
                margin: { t: 30, b: 35, l: 40, r: 8 },
                xaxis: { type: 'date', tickformat: '%d %b\n%H:%M', showgrid: true, gridcolor: '#eee', nticks: 4 },
                yaxis: { title: '°C', showgrid: true, gridcolor: '#eee' },
                paper_bgcolor: 'white', plot_bgcolor: 'white',
                font: { family: 'sans-serif', size: 11 },
                title: { text: 'Temperature (48 h)', font: { size: 13 } }
            }, cfg);

            // ── Full-grid charts ──────────────────────────────────────────────
            Plotly.newPlot('chart-temp',
                [line(t, d.Temp1, 'Temp1')],
                { ...layout('°C'), title: { text: 'Temperature', font: { size: 13 } } }, cfg);

            Plotly.newPlot('chart-humidity',
                [line(t, d.Hum1, 'Hum1')],
                { ...layout('%'), title: { text: 'Humidity', font: { size: 13 } } }, cfg);

            Plotly.newPlot('chart-radiation',
                [line(t, d.SWin, 'SWin'), line(t, d.SWout, 'SWout'),
                 line(t, d.LWin, 'LWin'), line(t, d.LWout, 'LWout')],
                { ...layout('W m⁻²'), title: { text: 'Radiation', font: { size: 13 } } }, cfg);

            Plotly.newPlot('chart-wind-speed',
                [line(t, d.WindSpeed, 'WindSpeed'), line(t, d.WindMax, 'WindMax', 'dot')],
                { ...layout('m s⁻¹'), title: { text: 'Wind Speed', font: { size: 13 } } }, cfg);

            Plotly.newPlot('chart-wind-dir',
                [{ x: t, y: d.WindDir, name: 'WindDir', type: 'scatter', mode: 'markers',
                   marker: { color: COLORS.Pressure, size: 2 } }],
                { ...layout('°'), title: { text: 'Wind Direction', font: { size: 13 } } }, cfg);

            Plotly.newPlot('chart-pressure',
                [line(t, d.Pressure, 'Pressure')],
                { ...layout('hPa'), title: { text: 'Pressure', font: { size: 13 } } }, cfg);

            Plotly.newPlot('chart-altitude',
                [line(t, d.Altitude, 'Altitude'), line(t, d.AltitudeTrend, 'AltitudeTrend', 'dash')],
                { ...layout('m a.s.l.'), title: { text: 'Station Altitude (snow height proxy)', font: { size: 13 } } }, cfg);

            Plotly.newPlot('chart-albedo',
                [line(t, d.Albedo, 'Albedo')],
                { ...layout('—'), title: { text: 'Surface Albedo', font: { size: 13 } },
                  yaxis: { ...layout('—').yaxis, range: [0, 1.05] } }, cfg);

            Plotly.newPlot('chart-clearness',
                [line(t, d.ClearnessIndex, 'ClearnessIndex')],
                { ...layout('—'), title: { text: 'Clearness Index', font: { size: 13 } },
                  yaxis: { ...layout('—').yaxis, range: [0, 1.05] } }, cfg);
        })
        .catch(err => {
            document.getElementById('updated').textContent = 'Error loading data: ' + err.message;
        });
    </script>
</body>
</html>
